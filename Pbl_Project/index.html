<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Manajemen Sertikom</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-wrapper { display: flex; width: 100%; max-width: 1000px; min-height: 580px; background: #fff; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); overflow: hidden; margin: 20px; border: 1px solid #e2e8f0; }
        .login-banner { flex: 1; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; }
        .brand-logo { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 700; }
        .login-form-container { flex: 1; padding: 48px; display: flex; flex-direction: column; justify-content: center; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.85rem; font-weight: 600; color: #334155; }
        .input-icon-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon-wrapper i.left-icon { position: absolute; left: 14px; color: #94a3b8; }
        .input-icon-wrapper i.toggle-password { position: absolute; right: 14px; color: #94a3b8; cursor: pointer; }
        input, select { width: 100%; padding: 11px 14px 11px 40px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; outline: none; }
        input:focus, select:focus { border-color: #0284c7; box-shadow: 0 0 0 3px #e0f2fe; }
        .btn-login { width: 100%; padding: 12px; background-color: #0284c7; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        .btn-login:hover { background-color: #0369a1; }
        @media (max-width: 768px) { .login-banner { display: none; } .login-wrapper { max-width: 450px; } }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-banner">
            <div class="brand-logo"><i class="fa-solid fa-certificate fa-lg"></i><span>My Course</span></div>
            <div>
                <h2 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 12px;">Sistem Informasi Manajemen Sertikom</h2>
                <p style="font-size: 0.95rem; opacity: 0.85;">Platform terpadu pendaftaran, pengujian assesor, hingga penerbitan sertifikat kompetensi resmi.</p>
            </div>
            <div style="font-size: 0.8rem; opacity: 0.7;">&copy; 2026 Politeknik Negeri Batam - TRPL</div>
        </div>

        <div class="login-form-container">
            <div style="margin-bottom: 32px;">
                <h3 style="font-size: 1.5rem; font-weight: 700; color: #0f172a;">Selamat Datang!</h3>
                <p style="font-size: 0.88rem; color: #64748b; margin-top: 4px;">Masukkan kredensial akun Anda untuk mengakses sistem.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="roleSelect">Masuk Sebagai</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-user-shield left-icon"></i>
                        <select name="role" id="roleSelect" required>
                            <option value="peserta" selected>Peserta / Mahasiswa</option>
                            <option value="assesor">Assesor / Penguji</option>
                            <option value="operator">Operator / Admin Jurusan</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">NIM / Email / ID Pengguna</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-envelope left-icon"></i>
                        <input type="text" id="username" name="username" placeholder="Masukkan NIM atau Email" required autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock left-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" required>
                        <i class="fa-solid fa-eye toggle-password" id="toggleEye" onclick="togglePassword()"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login" style="margin-top: 12px;">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang
                </button>
            </form>
        </div>
    </div>

    <script>
        // Toggle Show/Hide Password
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggleEye');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Jalankan pengalihan halaman berdasarkan role
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const role = document.getElementById('roleSelect').value;
            const username = document.getElementById('username').value;
            
            // Simpan data login sementara agar bisa dibaca di halaman dashboard
            localStorage.setItem('userRole', role);
            localStorage.setItem('username', username);

            // Pemetaan nama file dashboard berdasarkan role
            const dashboardMap = {
                'peserta': 'dashboard_peserta.html',
                'assesor': 'dashboard_assesor.html',
                'operator': 'dashboard_operator.html'
            };

            // Arahkan ke halaman dashboard yang sesuai
            if (dashboardMap[role]) {
                window.location.href = dashboardMap[role];
            } else {
                alert('Role tidak valid!');
            }
        });
    </script>
</body>
</html>
